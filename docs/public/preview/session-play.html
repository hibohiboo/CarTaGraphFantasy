<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>カルタグラフ セッション試作：プレイ画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root {
    --felt: #1f2a24;
    --felt-panel: #24322b;
    --felt-panel-2: #1a241e;
    --card: #efe7d8;
    --card-edge: rgba(43, 36, 28, 0.22);
    --ink: #2b241c;
    --ink-soft: #55493a;
    --parchment-text: #ddd3bf;
    --parchment-text-dim: #a99f8c;
    --seal: #a33227;
    --thread: #b8935a;
    --thread-dim: rgba(184, 147, 90, 0.38);
    --focus: #d9b877;
    --role-driver: #b8935a;
    --role-navigator: #7f93a6;
    --pending: #c9973f;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { color-scheme: dark; }

  body {
    margin: 0;
    background: var(--felt);
    color: var(--parchment-text);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    padding-inline: clamp(14px, 3vw, 32px);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  a { color: var(--focus); }
  a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .wrap { max-width: 1080px; margin-inline: auto; width: 100%; height: 100%; display: flex; flex-direction: column; min-height: 0; }

  /* ---------- proto nav ---------- */
  .proto-nav {
    flex: none;
    display: flex; align-items: center; gap: 14px;
    padding-block: 8px;
    font-size: 0.76rem;
    border-bottom: 1px solid rgba(184, 147, 90, 0.18);
    flex-wrap: wrap;
  }
  .proto-nav a { color: var(--parchment-text-dim); text-decoration: none; }
  .proto-nav a[aria-current="page"] { color: var(--focus); border-bottom: 2px solid var(--focus); padding-bottom: 2px; }
  .proto-nav .draft-pill { margin-left: auto; border: 1px solid var(--thread-dim); color: var(--thread); font-size: 0.68rem; padding: 2px 9px; border-radius: 999px; }

  /* ---------- HUD ---------- */
  .hud {
    flex: none;
    display: flex; align-items: center; gap: 14px;
    padding-block: 10px;
    flex-wrap: wrap;
  }
  .hud-title { font-family: "Zen Old Mincho", serif; font-size: 1.1rem; white-space: nowrap; }
  .hud-scene { font-size: 0.82rem; color: var(--parchment-text-dim); white-space: nowrap; }
  .hud-spacer { flex: 1; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 0.74rem;
    padding: 4px 11px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge-driver { color: var(--role-driver); }
  .badge-mode { color: var(--parchment-text-dim); border-style: dashed; }
  .hud-party { display: flex; align-items: center; gap: 4px; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--felt-panel); border: 1px solid var(--role-navigator); color: var(--role-navigator);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-family: "Zen Old Mincho", serif; flex: none;
  }
  .hud-party a { font-size: 0.76rem; margin-left: 4px; white-space: nowrap; }

  /* ---------- table (open play surface) ---------- */
  .table-open {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px;
  }
  .table-flavor {
    max-width: 30em;
    font-family: "Zen Old Mincho", serif;
    font-size: clamp(1.05rem, 2vw + 0.6rem, 1.4rem);
    line-height: 1.9;
    color: var(--parchment-text);
  }
  .table-flavor .dim { display: block; margin-top: 10px; font-family: "Zen Kaku Gothic New", sans-serif; font-size: 0.82rem; color: var(--parchment-text-dim); }

  .mystery-card {
    position: absolute;
    right: clamp(4px, 2vw, 28px);
    bottom: 6px;
    width: 60px; height: 84px;
    border-radius: 6px;
    background: repeating-linear-gradient(45deg, var(--felt-panel-2) 0 6px, #223027 6px 12px);
    border: 1px solid rgba(184, 147, 90, 0.4);
    display: flex; align-items: center; justify-content: center;
    color: var(--thread);
    font-family: "Zen Old Mincho", serif;
    font-size: 1.1rem;
    opacity: 0.85;
  }

  /* ---------- status line ---------- */
  .status-line {
    flex: none;
    text-align: center;
    font-size: 0.78rem;
    color: var(--parchment-text-dim);
    padding-bottom: 6px;
  }
  .status-line .pill {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--pending); border: 1px solid var(--pending);
    border-radius: 999px; padding: 1px 9px; margin-left: 6px; font-size: 0.72rem;
  }
  .status-line .pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  /* ---------- hand dock ---------- */
  .hand-dock {
    flex: none;
    overflow-x: auto;
    overflow-y: hidden;
    padding-block: 6px clamp(10px, 2vh, 18px);
  }
  .hand-row { display: flex; gap: 10px; width: max-content; margin-inline: auto; padding-inline: 2px; }
  .hand-card {
    position: relative;
    width: 110px;
    aspect-ratio: 5 / 7;
    flex: none;
    background: var(--card);
    color: var(--ink);
    border-radius: 8px;
    border: 2px solid transparent;
    box-shadow: 3px 3px 0 rgba(10, 14, 11, 0.32);
    padding: 9px 9px 8px;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform 120ms ease;
  }
  .hand-card:hover, .hand-card:focus-visible { transform: translateY(-6px); }
  .hand-card .field-tag {
    align-self: flex-start;
    font-size: 0.62rem;
    color: var(--ink-soft);
    border: 1px solid var(--ink-soft);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .hand-card .name {
    flex: 1;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: "Zen Old Mincho", serif;
    font-size: 0.94rem;
    line-height: 1.35;
    padding-top: 4px;
  }
  .hand-card.propose {
    background: var(--felt-panel-2);
    color: var(--thread);
    border: 2px dashed var(--thread);
    box-shadow: none;
  }
  .hand-card.propose .field-tag { color: var(--thread); border-color: var(--thread); }
  .hand-card.propose .name { font-family: "Zen Kaku Gothic New", sans-serif; font-size: 0.8rem; }
  .hand-card.active { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(217,184,119,0.25), 3px 3px 0 rgba(10,14,11,0.32); }
  .hand-divider { flex: none; width: 1px; align-self: stretch; background: rgba(184,147,90,0.25); margin-block: 6px; }

  @media (prefers-reduced-motion: reduce) {
    .hand-card { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <nav class="proto-nav">
    <a href="cartagraph-zukan.html">図鑑</a>
    <a href="session-play.html" aria-current="page">プレイ画面</a>
    <a href="session-gm-review.html">GM承認</a>
    <a href="session-chat.html">チャット</a>
    <a href="session-gm-manage.html">GM管理</a>
    <a href="scenario-manage.html">シナリオ管理</a>
    <a href="session-browse.html">セッション選択</a>
    <a href="character-create.html">キャラ作成</a>
    <a href="scene-builder.html">シーン構築</a>
    <a href="scene-play.html">シーン進行</a>
    <a href="combat-play.html">戦闘（2次元）</a>
    <a href="combat-play-1d.html">戦闘（1次元）</a>
    <span class="draft-pill">試作</span>
  </nav>

  <header class="hud">
    <span class="hud-title">灰色館の一夜</span>
    <span class="hud-scene">地下回廊 › 奥の扉</span>
    <span class="badge badge-driver">迅（ドライバー）</span>
    <span class="badge badge-mode">軽量モード</span>
    <div class="hud-spacer"></div>
    <div class="hud-party">
      <span class="avatar">カ</span>
      <span class="avatar">ル</span>
      <a href="session-chat.html">会話を見る</a>
    </div>
  </header>

  <main class="table-open">
    <p class="table-flavor">
      古びた扉の向こうから、かすかな音が聞こえる。
      <span class="dim">手札から1枚選んでプレイしよう。</span>
    </p>
    <div class="mystery-card" title="何かが書かれた紙（内容不明）">？</div>
  </main>

  <p class="status-line">
    「新たな選択肢を提案」で送信済み：扉を壊してみたい
    <span class="pill">GM裁定待ち</span>
  </p>

  <div class="hand-dock">
    <div class="hand-row">
      <div class="hand-card">
        <span class="field-tag">選択肢</span>
        <div class="name">開ける</div>
      </div>
      <div class="hand-card">
        <span class="field-tag">選択肢</span>
        <div class="name">調べる</div>
      </div>
      <div class="hand-card">
        <span class="field-tag">選択肢</span>
        <div class="name">戻る</div>
      </div>
      <div class="hand-card propose active">
        <span class="field-tag">選択肢</span>
        <div class="name">＋<br>新たな選択肢を提案</div>
      </div>
      <div class="hand-divider"></div>
      <div class="hand-card">
        <span class="field-tag">アイテム</span>
        <div class="name">灯火のランタン</div>
      </div>
      <div class="hand-card">
        <span class="field-tag">特徴</span>
        <div class="name">夜目が利く</div>
      </div>
      <div class="hand-card">
        <span class="field-tag">能力</span>
        <div class="name">先読み</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
